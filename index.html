<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcidBase Coach — Adaptive Tutor (ET617 · 24b3925)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Persistent Header: Navigation + C4 10-Minute Session Pacer & Pause/Resume -->
  <header class="app-header">
    <div class="header-top-row">
      <div class="brand-block">
        <span class="brand-logo" aria-hidden="true">🧪</span>
        <div>
          <strong class="brand-title">AcidBase Coach</strong>
          <span class="brand-subtitle">P4 Adaptive Tutor · Cl. 7–10 Acids, Bases & Indicators · ID: <code>24b3925</code></span>
        </div>
      </div>

      <div class="c4-session-widget" aria-label="10-Minute Session Timer">
        <div class="c4-timer-text">
          <span class="c4-badge">C4 10-Min Session</span>
          <strong id="c4-timer-readout">00:00 / 10:00 (10:00 left)</strong>
        </div>
        <div class="c4-progress-track" aria-hidden="true">
          <div id="c4-progress-fill" class="c4-progress-fill" style="width: 0%"></div>
        </div>
        <button type="button" id="c4-pause-btn" class="btn btn-small btn-outline" data-action="toggle-pause">
          ⏸ Pause & Save (C4)
        </button>
      </div>
    </div>

    <!-- 5 Connected Screens Navigation Bar (Deliverable D4) -->
    <nav class="main-nav" aria-label="Primary 5-Screen Navigation">
      <button type="button" class="nav-tab nav-tab-active" data-nav-screen="welcome">
        1. Welcome & Resume
      </button>
      <button type="button" class="nav-tab" data-nav-screen="concept">
        2. Concept & Dropper Lab (T6)
      </button>
      <button type="button" class="nav-tab" data-nav-screen="tutor">
        3. Adaptive Tutor (P4)
      </button>
      <button type="button" class="nav-tab" data-nav-screen="summary">
        4. Progress & D5 Scenarios
      </button>
      <button type="button" class="nav-tab" data-nav-screen="about">
        5. About & Card (24b3925)
      </button>
    </nav>
  </header>

  <!-- C4 Pause & Save Drawer -->
  <div id="c4-pause-drawer" class="c4-pause-drawer" hidden></div>

  <!-- Main Screen Container -->
  <main id="app-main" class="app-main" role="main"></main>

  <!-- Mandatory Identity Token Footer on Every Screen (Section 2 Identity Rules) -->
  <footer id="identity-footer" class="identity-footer" role="contentinfo">
    <div class="footer-inner">
      <span><strong>Identity Token (Roll No.):</strong> <code>24b3925</code> (<code>24B3925</code>)</span>
      <span><strong>Exam Card:</strong> <code>P4</code> Adaptive Tutor · <code>P4-T4</code> Acids, Bases & Indicators · <code>L5</code> Anxious Repeat Learner · <code>C4</code> 10-Min Sessions</span>
      <button type="button" class="btn-link" data-nav-screen="about">View Full Exam Card & AI Spec →</button>
    </div>
  </footer>

  <script type="module" src="./src/app.js"></script>
</body>
</html>

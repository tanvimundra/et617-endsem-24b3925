<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcidBase Coach — Interactive Science Tutor</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Clean Learner Header: Brand + 10-Minute Study Session Timer & Pause/Save -->
  <header class="app-header">
    <div class="header-top-row">
      <div class="brand-block">
        <span class="brand-logo" aria-hidden="true">🧪</span>
        <div>
          <strong class="brand-title">AcidBase Coach</strong>
          <span class="brand-subtitle">Acids, Bases & Indicators · Calm 10-Minute Practice</span>
        </div>
      </div>

      <div class="c4-session-widget" aria-label="10-Minute Study Session Timer">
        <div class="c4-timer-text">
          <span class="c4-badge">10-Min Session</span>
          <strong id="c4-timer-readout">00:00 / 10:00</strong>
        </div>
        <div class="c4-progress-track" aria-hidden="true">
          <div id="c4-progress-fill" class="c4-progress-fill" style="width: 0%"></div>
        </div>
        <button type="button" id="c4-pause-btn" class="btn btn-small btn-outline" data-action="toggle-pause">
          ⏸ Pause & Save
        </button>
      </div>
    </div>

    <!-- 5 Connected Screens Navigation Bar -->
    <nav class="main-nav" aria-label="Primary Navigation">
      <button type="button" class="nav-tab nav-tab-active" data-nav-screen="welcome">
        1. Start
      </button>
      <button type="button" class="nav-tab" data-nav-screen="concept">
        2. Notes & Colour Lab
      </button>
      <button type="button" class="nav-tab" data-nav-screen="tutor">
        3. Practice Coach
      </button>
      <button type="button" class="nav-tab" data-nav-screen="summary">
        4. My Progress
      </button>
      <button type="button" class="nav-tab" data-nav-screen="about">
        5. About
      </button>
    </nav>
  </header>

  <!-- Pause & Save Banner -->
  <div id="c4-pause-drawer" class="c4-pause-drawer" hidden></div>

  <!-- Main Screen Container -->
  <main id="app-main" class="app-main" role="main"></main>

  <!-- Subtle Mandatory Footer with Identity Token on Every Screen (Section 2 Rule) -->
  <footer id="identity-footer" class="identity-footer" role="contentinfo">
    <div class="footer-inner">
      <span>AcidBase Coach · Class 7–10 Science</span>
      <span>Identity Token: <code>24b3925</code></span>
    </div>
  </footer>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
